# ==============================================================================
# Generic Kubernetes Investigation & Troubleshooting Taskfile
# Task (go-task) equivalent to Makefilek8s
# https://taskfile.dev
# ==============================================================================
version: '3'

vars:
  CTX:
    sh: kubectl config current-context 2>/dev/null || echo ""
  NS: '{{.NS | default "default"}}'
  NODE: '{{.NODE | default ""}}'
  DEPLOYMENT: '{{.DEPLOYMENT | default ""}}'
  POD: '{{.POD | default ""}}'
  HPA: '{{.HPA | default ""}}'
  RELEASE_NAME: '{{.RELEASE_NAME | default ""}}'
  CONFIGMAP: '{{.CONFIGMAP | default ""}}'
  PROJECT_ID: '{{.PROJECT_ID | default ""}}'
  CLUSTER_NAME: '{{.CLUSTER_NAME | default ""}}'
  REGION: '{{.REGION | default ""}}'
  NODE_POOL: '{{.NODE_POOL | default ""}}'
  REPLICAS: '{{.REPLICAS | default "1"}}'

tasks:
  default:
    desc: Show all available tasks
    silent: true
    cmds:
      - task --list

  # ----------------------------------------------------------------------------
  # 1. Cluster & Context Discovery
  # ----------------------------------------------------------------------------
  contexts:
    desc: List all available kubectl contexts
    cmds:
      - kubectl config get-contexts

  namespaces:
    desc: List all namespaces in cluster (uses CTX)
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set and no active context found. Run: task namespaces CTX=<context>"
    cmds:
      - 'kubectl --context={{.CTX}} get namespaces'

  current-context:
    desc: Print the currently active context
    silent: true
    cmds:
      - 'echo "Active Context: {{.CTX}}"'

  # ----------------------------------------------------------------------------
  # 2. Node Health, Capacity & Schedulable Headroom
  # ----------------------------------------------------------------------------
  nodes:
    desc: List nodes with OS, kernel, container runtime, and status
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task nodes CTX=<context>"
    cmds:
      - 'kubectl --context={{.CTX}} get nodes -o wide'

  nodes-top:
    desc: Live CPU & Memory utilization per node
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task nodes-top CTX=<context>"
    cmds:
      - 'kubectl --context={{.CTX}} top nodes'

  nodes-pressure:
    desc: Check node conditions (Ready, DiskPressure, MemoryPressure, PIDPressure)
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task nodes-pressure CTX=<context>"
    cmds:
      - |
        kubectl --context={{.CTX}} get nodes \
          -o custom-columns=NAME:.metadata.name,READY:'.status.conditions[?(@.type=="Ready")].status',DISK_PRESSURE:'.status.conditions[?(@.type=="DiskPressure")].status',MEM_PRESSURE:'.status.conditions[?(@.type=="MemoryPressure")].status',PID_PRESSURE:'.status.conditions[?(@.type=="PIDPressure")].status',TRANSITION:'.status.conditions[?(@.type=="DiskPressure")].lastTransitionTime'

  nodes-capacity:
    desc: Show node compute capacity vs. allocatable
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task nodes-capacity CTX=<context>"
    cmds:
      - |
        kubectl --context={{.CTX}} get nodes \
          -o custom-columns=NAME:.metadata.name,CPU_CAP:.status.capacity.cpu,CPU_ALLOC:.status.allocatable.cpu,MEM_CAP:.status.capacity.memory,MEM_ALLOC:.status.allocatable.memory

  nodes-storage:
    desc: Show node ephemeral storage capacity vs. allocatable
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task nodes-storage CTX=<context>"
    cmds:
      - |
        kubectl --context={{.CTX}} get nodes \
          -o custom-columns=NAME:.metadata.name,EPHEM_CAP:.status.capacity.ephemeral-storage,EPHEM_ALLOC:.status.allocatable.ephemeral-storage

  node-allocated:
    desc: Show allocated CPU & Memory requests/limits on a node (requires NODE=...)
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task node-allocated CTX=<context>"
      - sh: '[ -n "{{.NODE}}" ]'
        msg: "NODE parameter is required. Run: task node-allocated NODE=<node_name>"
    cmds:
      - 'kubectl --context={{.CTX}} describe node {{.NODE}} | grep -A 15 -E "Allocated resources:"'

  node-pods:
    desc: List non-terminated pods running on a specific node (requires NODE=...)
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task node-pods CTX=<context>"
      - sh: '[ -n "{{.NODE}}" ]'
        msg: "NODE parameter is required. Run: task node-pods NODE=<node_name>"
    cmds:
      - 'kubectl --context={{.CTX}} get pods -A --field-selector spec.nodeName={{.NODE}}'

  # ----------------------------------------------------------------------------
  # 3. Workload Utilization & Bottleneck Diagnostics
  # ----------------------------------------------------------------------------
  top-cpu:
    desc: Top pods sorted by CPU usage across all namespaces
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task top-cpu CTX=<context>"
    cmds:
      - 'kubectl --context={{.CTX}} top pods -A --sort-by=cpu'

  top-mem:
    desc: Top pods sorted by Memory usage across all namespaces
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task top-mem CTX=<context>"
    cmds:
      - 'kubectl --context={{.CTX}} top pods -A --sort-by=memory'

  pods-unhealthy:
    desc: List all pods not in Running or Completed state
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task pods-unhealthy CTX=<context>"
    cmds:
      - 'kubectl --context={{.CTX}} get pods -A | grep -v -E "Running|Completed" || echo "All pods are Running or Completed."'

  pods-failed:
    desc: List all Failed / Evicted pods across all namespaces
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task pods-failed CTX=<context>"
    cmds:
      - 'kubectl --context={{.CTX}} get pods -A --field-selector=status.phase=Failed'

  pods-restarts:
    desc: List pods with restarts > 0 sorted by restart count
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task pods-restarts CTX=<context>"
    cmds:
      - |
          kubectl --context={{.CTX}} get pods -A --sort-by='.status.containerStatuses[0].restartCount' | grep -v '0\s\+' || echo "No restarted pods found."

  pod-last-state:
    desc: Inspect termination reason & exit code of a pod (requires POD=... NS=...)
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task pod-last-state CTX=<context>"
      - sh: '[ -n "{{.POD}}" ]'
        msg: "POD parameter is required. Run: task pod-last-state POD=<pod_name> [NS=<namespace>]"
    cmds:
      - |
          kubectl --context={{.CTX}} get pod {{.POD}} -n {{.NS}} -o jsonpath='{.status.containerStatuses[*].lastState}'
      - echo ""

  hpa:
    desc: List all Horizontal Pod Autoscalers (HPAs)
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task hpa CTX=<context>"
    cmds:
      - 'kubectl --context={{.CTX}} get hpa -A'

  hpa-describe:
    desc: Describe specific HPA (requires HPA=... NS=...)
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task hpa-describe CTX=<context>"
      - sh: '[ -n "{{.HPA}}" ]'
        msg: "HPA parameter is required. Run: task hpa-describe HPA=<hpa_name> [NS=<namespace>]"
    cmds:
      - 'kubectl --context={{.CTX}} describe hpa {{.HPA}} -n {{.NS}}'

  workloads:
    desc: List all Deployments, StatefulSets, and DaemonSets
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task workloads CTX=<context>"
    cmds:
      - echo "=== DEPLOYMENTS ==="
      - 'kubectl --context={{.CTX}} get deployments -A'
      - echo -e "\n=== STATEFULSETS ==="
      - 'kubectl --context={{.CTX}} get statefulset -A'
      - echo -e "\n=== DAEMONSETS ==="
      - 'kubectl --context={{.CTX}} get daemonset -A'

  events-warning:
    desc: Recent Warning events cluster-wide sorted by timestamp
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task events-warning CTX=<context>"
    cmds:
      - |
          kubectl --context={{.CTX}} get events -A --field-selector type=Warning --sort-by='.lastTimestamp'

  # ----------------------------------------------------------------------------
  # 4. Rollout & Scheduling Diagnostics
  # ----------------------------------------------------------------------------
  rollout-status:
    desc: Check deployment rollout status (requires DEPLOYMENT=... NS=...)
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task rollout-status CTX=<context>"
      - sh: '[ -n "{{.DEPLOYMENT}}" ]'
        msg: "DEPLOYMENT parameter is required. Run: task rollout-status DEPLOYMENT=<deployment_name> [NS=<namespace>]"
    cmds:
      - 'kubectl --context={{.CTX}} rollout status deployment {{.DEPLOYMENT}} -n {{.NS}}'

  pod-describe:
    desc: Describe a pod to inspect scheduler events (requires POD=... NS=...)
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task pod-describe CTX=<context>"
      - sh: '[ -n "{{.POD}}" ]'
        msg: "POD parameter is required. Run: task pod-describe POD=<pod_name> [NS=<namespace>]"
    cmds:
      - 'kubectl --context={{.CTX}} describe pod {{.POD}} -n {{.NS}}'

  deployment-resources:
    desc: Inspect container resource requests/limits of deployment (requires DEPLOYMENT=... NS=...)
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task deployment-resources CTX=<context>"
      - sh: '[ -n "{{.DEPLOYMENT}}" ]'
        msg: "DEPLOYMENT parameter is required. Run: task deployment-resources DEPLOYMENT=<deployment_name> [NS=<namespace>]"
    cmds:
      - |
          kubectl --context={{.CTX}} get deployment {{.DEPLOYMENT}} -n {{.NS}} -o jsonpath='{.spec.template.spec.containers[*].resources}'
      - echo ""

  pod-resources:
    desc: Show resource requests/limits for all containers & sidecars in pod (requires POD=... NS=...)
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task pod-resources CTX=<context>"
      - sh: '[ -n "{{.POD}}" ]'
        msg: "POD parameter is required. Run: task pod-resources POD=<pod_name> [NS=<namespace>]"
    cmds:
      - echo "--- App Containers ---"
      - |
          kubectl --context={{.CTX}} get pod {{.POD}} -n {{.NS}} -o json | jq '.spec.containers[] | {name: .name, resources: .resources}'
      - echo "--- Init / Sidecar Containers ---"
      - |
          kubectl --context={{.CTX}} get pod {{.POD}} -n {{.NS}} -o json | jq '.spec.initContainers[] | {name: .name, resources: .resources}'

  rollout-strategy:
    desc: Inspect deployment rolling update strategy (requires DEPLOYMENT=... NS=...)
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task rollout-strategy CTX=<context>"
      - sh: '[ -n "{{.DEPLOYMENT}}" ]'
        msg: "DEPLOYMENT parameter is required. Run: task rollout-strategy DEPLOYMENT=<deployment_name> [NS=<namespace>]"
    cmds:
      - |
          kubectl --context={{.CTX}} get deployment {{.DEPLOYMENT}} -n {{.NS}} -o jsonpath='{.spec.strategy.rollingUpdate}'
      - echo ""

  # ----------------------------------------------------------------------------
  # 5. Storage & DiskPressure (Kubelet Summary API)
  # ----------------------------------------------------------------------------
  node-fs:
    desc: Inspect node root filesystem & imageFs via Kubelet Summary API (requires NODE=...)
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task node-fs CTX=<context>"
      - sh: '[ -n "{{.NODE}}" ]'
        msg: "NODE parameter is required. Run: task node-fs NODE=<node_name>"
    cmds:
      - |
          kubectl --context={{.CTX}} get --raw "/api/v1/nodes/{{.NODE}}/proxy/stats/summary" | jq '.node.fs, .node.runtime.imageFs'

  pod-storage:
    desc: Show ephemeral storage consumed by every pod on node (requires NODE=...)
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task pod-storage CTX=<context>"
      - sh: '[ -n "{{.NODE}}" ]'
        msg: "NODE parameter is required. Run: task pod-storage NODE=<node_name>"
    cmds:
      - |
          kubectl --context={{.CTX}} get --raw "/api/v1/nodes/{{.NODE}}/proxy/stats/summary" | jq '[.pods[] | {pod: .podRef.name, namespace: .podRef.namespace, ephemeral: .["ephemeral-storage"]}]'

  images-by-size:
    desc: List all container images on node sorted by size in MB (requires NODE=...)
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task images-by-size CTX=<context>"
      - sh: '[ -n "{{.NODE}}" ]'
        msg: "NODE parameter is required. Run: task images-by-size NODE=<node_name>"
    cmds:
      - |
          kubectl --context={{.CTX}} get node {{.NODE}} -o json | jq '[.status.images[] | {names: .names, sizeMB: (.sizeBytes / 1024 / 1024 | floor)}] | sort_by(-.sizeMB)'

  # ----------------------------------------------------------------------------
  # 6. Deep Python Diagnostic Scripts
  # ----------------------------------------------------------------------------
  analyze-namespaces:
    desc: Aggregate per-namespace actual usage vs. requests vs. limits
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task analyze-namespaces CTX=<context>"
    cmds:
      - 'python3 scripts/analyze_namespaces.py --context="{{.CTX}}"'

  analyze-nodes:
    desc: Calculate allocatable vs requested resources and remaining headroom per node
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task analyze-nodes CTX=<context>"
    cmds:
      - 'python3 scripts/analyze_nodes.py --context="{{.CTX}}" {{if .NODE}}--node="{{.NODE}}"{{end}}'

  analyze-disks:
    desc: Query Kubelet Summary API across all nodes for root vs imageFs footprint
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task analyze-disks CTX=<context>"
    cmds:
      - 'python3 scripts/analyze_disks.py --context="{{.CTX}}" {{if .NODE}}--node="{{.NODE}}"{{end}}'

  watch-disk:
    desc: Live check node disk usage percentage and available bytes (requires NODE=...)
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task watch-disk CTX=<context>"
      - sh: '[ -n "{{.NODE}}" ]'
        msg: "NODE parameter is required. Run: task watch-disk NODE=<node_name>"
    cmds:
      - 'python3 scripts/watch_disk.py --context="{{.CTX}}" --node="{{.NODE}}"'

  # ----------------------------------------------------------------------------
  # 7. Cloud Infrastructure (GKE / GCP)
  # ----------------------------------------------------------------------------
  gke-clusters:
    desc: List GKE clusters in project (requires PROJECT_ID=...)
    preconditions:
      - sh: '[ -n "{{.PROJECT_ID}}" ]'
        msg: "PROJECT_ID is required. Run: task gke-clusters PROJECT_ID=<project_id>"
    cmds:
      - 'gcloud container clusters list --project {{.PROJECT_ID}}'

  gke-nodepools:
    desc: List node pools in cluster (requires CLUSTER_NAME=... REGION=... PROJECT_ID=...)
    preconditions:
      - sh: '[ -n "{{.CLUSTER_NAME}}" ] && [ -n "{{.REGION}}" ] && [ -n "{{.PROJECT_ID}}" ]'
        msg: "CLUSTER_NAME, REGION, and PROJECT_ID are required. Run: task gke-nodepools CLUSTER_NAME=<name> REGION=<reg> PROJECT_ID=<pid>"
    cmds:
      - 'gcloud container node-pools list --cluster {{.CLUSTER_NAME}} --region {{.REGION}} --project {{.PROJECT_ID}}'

  gke-nodepool-describe:
    desc: Describe node pool autoscaling & count (requires NODE_POOL=... CLUSTER_NAME=... REGION=... PROJECT_ID=...)
    preconditions:
      - sh: '[ -n "{{.NODE_POOL}}" ] && [ -n "{{.CLUSTER_NAME}}" ] && [ -n "{{.REGION}}" ] && [ -n "{{.PROJECT_ID}}" ]'
        msg: "NODE_POOL, CLUSTER_NAME, REGION, and PROJECT_ID are required."
    cmds:
      - 'gcloud container node-pools describe {{.NODE_POOL}} --cluster {{.CLUSTER_NAME}} --region {{.REGION}} --project {{.PROJECT_ID}} --format="json(autoscaling, initialNodeCount, management)"'

  gke-autoscaling:
    desc: Inspect cluster autoscaling profile (requires CLUSTER_NAME=... REGION=... PROJECT_ID=...)
    preconditions:
      - sh: '[ -n "{{.CLUSTER_NAME}}" ] && [ -n "{{.REGION}}" ] && [ -n "{{.PROJECT_ID}}" ]'
        msg: "CLUSTER_NAME, REGION, and PROJECT_ID are required."
    cmds:
      - 'gcloud container clusters describe {{.CLUSTER_NAME}} --region {{.REGION}} --project {{.PROJECT_ID}} --format="json(autoscaling)"'

  gke-nodepool-specs:
    desc: Inspect full node pool machine & disk specifications (requires CLUSTER_NAME=... REGION=... PROJECT_ID=...)
    preconditions:
      - sh: '[ -n "{{.CLUSTER_NAME}}" ] && [ -n "{{.REGION}}" ] && [ -n "{{.PROJECT_ID}}" ]'
        msg: "CLUSTER_NAME, REGION, and PROJECT_ID are required."
    cmds:
      - 'gcloud container clusters describe {{.CLUSTER_NAME}} --region {{.REGION}} --project {{.PROJECT_ID}} --format="json(nodePools)"'

  # ----------------------------------------------------------------------------
  # 8. Helm & Live Manifests
  # ----------------------------------------------------------------------------
  helm-values:
    desc: Inspect user-supplied Helm values (requires RELEASE_NAME=... NS=...)
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task helm-values CTX=<context>"
      - sh: '[ -n "{{.RELEASE_NAME}}" ]'
        msg: "RELEASE_NAME parameter is required. Run: task helm-values RELEASE_NAME=<release> [NS=<namespace>]"
    cmds:
      - 'helm get values {{.RELEASE_NAME}} -n {{.NS}} --kube-context={{.CTX}}'

  configmap:
    desc: Inspect ConfigMap YAML (requires CONFIGMAP=... NS=...)
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task configmap CTX=<context>"
      - sh: '[ -n "{{.CONFIGMAP}}" ]'
        msg: "CONFIGMAP parameter is required. Run: task configmap CONFIGMAP=<cm_name> [NS=<namespace>]"
    cmds:
      - 'kubectl --context={{.CTX}} get configmap {{.CONFIGMAP}} -n {{.NS}} -o yaml'

  # ----------------------------------------------------------------------------
  # 9. Operational Remediation Commands
  # ----------------------------------------------------------------------------
  clean-failed-pods:
    desc: Delete all Failed / Evicted pods across all namespaces
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task clean-failed-pods CTX=<context>"
    cmds:
      - 'kubectl --context={{.CTX}} delete pod -A --field-selector=status.phase=Failed'

  rollout-restart:
    desc: Force rolling restart of a deployment (requires DEPLOYMENT=... NS=...)
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task rollout-restart CTX=<context>"
      - sh: '[ -n "{{.DEPLOYMENT}}" ]'
        msg: "DEPLOYMENT parameter is required. Run: task rollout-restart DEPLOYMENT=<deployment_name> [NS=<namespace>]"
    cmds:
      - 'kubectl --context={{.CTX}} rollout restart deployment {{.DEPLOYMENT}} -n {{.NS}}'

  scale-workload:
    desc: Emergency scaling of a deployment (requires DEPLOYMENT=... NS=... REPLICAS=...)
    preconditions:
      - sh: '[ -n "{{.CTX}}" ]'
        msg: "CTX is not set. Run: task scale-workload CTX=<context>"
      - sh: '[ -n "{{.DEPLOYMENT}}" ]'
        msg: "DEPLOYMENT parameter is required. Run: task scale-workload DEPLOYMENT=<deployment_name> [REPLICAS=<count>] [NS=<namespace>]"
    cmds:
      - 'kubectl --context={{.CTX}} scale deployment {{.DEPLOYMENT}} -n {{.NS}} --replicas={{.REPLICAS}}'
